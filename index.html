
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#070d1c">
<meta name="description" content="الصفحة الرسمية للدكتور عامر علوان الطائي">
<title>د. عامر علوان الطائي | الروابط الرسمية</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
:root {
    --bg: #070d1c;
    --blue: #2789ff;
    --cyan: #45d9ff;
    --text: #f3f7ff;
    --muted: #899bb9;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Cairo', sans-serif;
    min-height: 100vh;
    color: var(--text);
    background:
        radial-gradient(ellipse at 50% 0%, #153c72 0%, transparent 48%),
        radial-gradient(circle at 0% 90%, #142a52 0%, transparent 35%),
        radial-gradient(circle at 100% 70%, #15214a 0%, transparent 35%),
        var(--bg);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 35px 18px;
    overflow-x: hidden;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: .15;
    background-image:
        linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px);
    background-size: 45px 45px;
}

.container {
    width: 100%;
    max-width: 470px;
    position: relative;
    z-index: 1;
    animation: appear 1s ease both;
}

@keyframes appear {
    from { opacity: 0; transform: translateY(25px); }
    to { opacity: 1; transform: translateY(0); }
}

/* PROFILE */

.profile {
    text-align: center;
    margin-bottom: 32px;
}

.avatar-wrapper {
    width: 160px;
    height: 160px;
    padding: 5px;
    margin: 0 auto 23px;
    border-radius: 50%;
    background: linear-gradient(135deg, #48dfff, #2679ff, #825cff);
    box-shadow:
        0 0 25px #258bff55,
        0 0 70px #258bff22;
    position: relative;
}

.avatar-wrapper::before {
    content: "";
    position: absolute;
    inset: -12px;
    border: 1px solid #46c9ff44;
    border-radius: 50%;
    animation: pulse 3s infinite;
}

@keyframes pulse {
    0%,100% { transform: scale(1); opacity: .5; }
    50% { transform: scale(1.08); opacity: 1; }
}

.avatar {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    overflow: hidden;
    background: #14294a;
    border: 3px solid #0b1730;
}

.avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

.verified {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 13px;
    border-radius: 30px;
    color: #70dfff;
    background: #168bff18;
    border: 1px solid #168bff44;
    font-size: 11px;
    font-weight: 700;
    margin-bottom: 12px;
}

.verified span {
    color: #39d9ff;
}

.profile h1 {
    font-size: 27px;
    font-weight: 900;
    color: #fff;
    margin-bottom: 5px;
}

.specialty {
    font-size: 14px;
    color: #67caff;
    font-weight: 700;
}

.description {
    color: var(--muted);
    font-size: 12px;
    margin-top: 9px;
    line-height: 2;
}

/* DIVIDER */

.section-title {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 17px;
    color: #9fb2d1;
    font-size: 13px;
    font-weight: 700;
}

.section-title::before,
.section-title::after {
    content: "";
    height: 1px;
    flex: 1;
    background: linear-gradient(90deg, transparent, #3a83c966);
}

/* SOCIAL LINKS */

.links {
    display: flex;
    flex-direction: column;
    gap: 13px;
}

.social-card {
    display: flex;
    align-items: center;
    gap: 15px;
    padding: 15px 17px;
    background: linear-gradient(120deg,
        rgba(255,255,255,.075),
        rgba(255,255,255,.025));
    border: 1px solid rgba(255,255,255,.10);
    border-radius: 19px;
    text-decoration: none;
    color: white;
    backdrop-filter: blur(15px);
    position: relative;
    overflow: hidden;
    transition: .35s ease;
}

.social-card::before {
    content: "";
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(100deg,
        transparent,
        rgba(255,255,255,.09),
        transparent);
    transition: .6s;
}

.social-card:hover::before {
    left: 100%;
}

.social-card:hover {
    transform: translateY(-4px);
    border-color: #43baff88;
    box-shadow: 0 10px 30px #087bff22;
    background: rgba(35,115,200,.12);
}

.icon {
    width: 53px;
    height: 53px;
    min-width: 53px;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 25px;
    font-weight: 800;
    box-shadow: inset 0 1px 5px #ffffff33;
}

.icon svg {
    width: 26px;
    height: 26px;
    fill: white;
}

.facebook .icon {
    background: linear-gradient(135deg,#1877f2,#0754bc);
}

.tiktok .icon {
    background: linear-gradient(135deg,#252525,#090909);
}

.whatsapp .icon {
    background: linear-gradient(135deg,#32e77d,#079c58);
}

.details {
    flex: 1;
}

.details h2 {
    font-size: 15px;
    font-weight: 800;
}

.details span {
    font-size: 11px;
    color: #91a4c3;
}

.arrow {
    width: 33px;
    height: 33px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 11px;
    background: #ffffff0b;
    color: #6ebfff;
    font-size: 19px;
    transition: .3s;
}

.social-card:hover .arrow {
    background: #258bff33;
    transform: translateX(-4px);
}

/* FOOTER */

.footer {
    text-align: center;
    margin-top: 30px;
    padding-top: 20px;
    border-top: 1px solid #ffffff12;
    color: #7386a6;
    font-size: 11px;
}

.footer span {
    color: #42bfff;
}

.footer .brand {
    display: block;
    margin-top: 5px;
    color: #a3b5d0;
    font-size: 10px;
}

@media(max-width:400px) {
    .profile h1 { font-size: 23px; }
    .avatar-wrapper { width: 140px; height: 140px; }
    .social-card { padding: 13px; }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
    }
}
</style>
</head>

<body>

</main>

</body>
</html>
